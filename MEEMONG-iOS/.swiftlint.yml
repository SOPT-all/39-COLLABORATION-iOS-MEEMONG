# MEEMONG 코드 컨벤션 / SwiftLint 0.63.2
# 이 파일과 같은 위치의 MEEMONG-iOS.xcodeproj를 기준으로 사용합니다.
# 문서의 90자 권장 / 99자 최대 기준을 각각 경고 / 오류로 적용합니다.

included:
  - MEEMONG-iOS

excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData

# 문서와 연결되는 규칙만 명시합니다. 기본 규칙 전체를 켜지 않습니다.
only_rules:
  - attributes
  - colon
  - comma
  - custom_rules
  - force_unwrapping
  - identifier_name
  - indentation_width
  - line_length
  - mark
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - private_swiftui_state
  - redundant_self
  - redundant_type_annotation
  - sorted_imports
  - trailing_newline
  - trailing_whitespace
  - type_name
  - unused_closure_parameter
  - vertical_whitespace

# 전체 타입 검사가 필요한 규칙입니다.
# 일반 lint가 아니라 swiftlint analyze --compiler-log-path <빌드 로그>로 실행합니다.
analyzer_rules:
  - unused_import

line_length:
  warning: 90
  error: 99
  ignores_comments: false
  ignores_urls: false
  ignores_interpolated_strings: false

indentation_width:
  indentation_width: 4
  include_comments: true

colon:
  flexible_right_spacing: false
  apply_to_dictionaries: true

trailing_whitespace:
  ignores_empty_lines: false
  ignores_comments: false

vertical_whitespace:
  max_empty_lines: 1

attributes:
  always_on_line_above:
    - "@objc"

multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: false

multiline_parameters:
  allows_single_line: true

# 문서에 이름 길이 제한은 없으므로 SwiftLint 기본 길이 제한은 완화합니다.
# 의미 있는 이름과 약어 사용 여부는 코드 리뷰로 확인합니다.
identifier_name:
  min_length: 1
  max_length: 1000
  allowed_symbols:
    - "_"
  validates_start_with_lowercase: warning

type_name:
  min_length: 1
  max_length: 1000
  allowed_symbols:
    - "_"
  # Xcode가 프로젝트 이름에서 자동 생성한 앱 진입점은 그대로 허용합니다.
  excluded:
    - '^MEEMONG_iOSApp$'

force_unwrapping:
  severity: warning

custom_rules:
  operator_function_spacing:
    name: "연산자 함수 공백"
    regex: 'func[ \t]+[=+*/%<>!&|^~?.-]+\('
    match_kinds:
      - keyword
    message: "연산자 함수 정의에서 연산자와 괄호 사이를 한 칸 띄우세요."
    severity: warning

  debug_print:
    name: "임시 출력 확인"
    regex: '\b(print|debugPrint|dump)[ \t]*\('
    match_kinds:
      - identifier
    message: "push 전에 불필요한 디버깅 출력인지 확인하고 제거하세요."
    severity: warning

# 자동 검사의 한계 / 코드 리뷰 및 PR 체크리스트로 확인할 항목:
# - lowerCamelCase / UpperCamelCase의 의미, URL·ID·API·DTO 약어, Bool 접두사, 동사형 함수명
# - let 우선 사용, 필요한 private / private(set) / final, 불필요한 public / open
# - 프로토콜 구현을 extension으로 분리하고 extension 하나당 프로토콜 하나만 채택
# - 타입·extension 내부 위아래 빈 줄, 함수 사이 빈 줄, 함수 내부 시작·끝의 빈 줄 제거
#   vertical_whitespace_opening_braces / closing_braces는 타입의 빈 줄과 충돌하여 사용하지 않음
# - MARK 위아래 빈 줄, 긴 if let / guard let 조건과 else 정렬
# - 클로저 인자가 2개 이상이면 항상 줄바꿈
# - 내장 / 서드파티 import 그룹 분리 및 그룹별 정렬 (sorted_imports는 정렬만 보조)
# - 주석·미사용 코드 제거, 적절한 ?? 기본값, 순환 참조가 가능한 경우의 weak self
# - SwiftUI View 분리, MainActor, 오류·로딩 상태·취소 처리, 빈 catch 지양
# - 파일·에셋 이름, 에셋 포맷, 공통 색상·폰트·간격 사용
# - PR 전 Preview·목업 제거 (개발 중 Preview는 허용하므로 상시 경고하지 않음)
# - 빌드·실제 동작 확인, 리뷰 승인 및 공유, merge 전 pull
